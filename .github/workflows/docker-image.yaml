# Dockerイメージのビルド定義(単一の情報源)。
# 呼び出し側がトリガー条件とpushの有無だけを決める。
name: Docker Image

on:
  workflow_call:
    inputs:
      push:
        description: "ghcr.ioへ公開するかどうか"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # イベント種別ごとのタグ:
          #   mainへのpush            -> edge + sha
          #   v*タグ                  -> semver + latest + sha
          #   workflow_dispatch       -> ブランチ名 + sha
          #   pull_request(push無し) -> ci(ビルド確認のみ)
          tags: |
            type=edge,branch=main
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && github.ref_name != 'main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ inputs.push }}
            type=raw,value=ci,enable=${{ !inputs.push }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
